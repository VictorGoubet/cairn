name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a new push supersedes the run in flight
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the end-to-end suite talks to IGN, BRouter and Overpass: it belongs on a developer's
      # machine (make test-e2e), not in a pipeline that would go red when a free API hiccups
      - run: make check
