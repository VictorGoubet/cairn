<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Free hiking and trek planner · Planificateur de rando et trek gratuit"
    />
    <title>Planificateur de rando</title>
    <!-- a shared route replaces these with its own name, stats and tile (see api/s.ts) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="cairn" />
    <meta property="og:title" content="cairn · free hiking and trek planner" />
    <meta
      property="og:description"
      content="Plan a route that follows real trails, on official IGN maps. No account, open data."
    />
    <meta
      property="og:image"
      content="https://cairn-swart-gamma.vercel.app/og.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- data-domains keeps localhost out of the stats: the script loads but stays silent -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="1bd0a41c-5495-437d-a266-a38b62251c51"
      data-domains="cairn-swart-gamma.vercel.app"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
